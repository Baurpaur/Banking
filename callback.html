<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Bank authorisation – Personal Budget Tracker</title>
<style>
  body{font:16px/1.6 system-ui,sans-serif;max-width:42rem;margin:2rem auto;padding:0 1rem;color:#222}
  code,textarea{font:13px/1.4 ui-monospace,monospace}
  textarea{width:100%;height:7rem;padding:.5rem;box-sizing:border-box}
  button{padding:.5rem 1rem;font-size:1rem;cursor:pointer}
  .err{color:#b00020}
</style>
</head>
<body>
<h1>Bank authorisation</h1>
<p id="msg"></p>
<textarea id="url" readonly></textarea>
<p><button id="copy">Copy</button></p>
<p>Return to your terminal and paste this into <code>python budget.py login</code>. The code is single-use and only works together with the private key on your computer. Nothing on this page is stored or sent anywhere.</p>
<script>
  var url = window.location.href, p = new URLSearchParams(window.location.search);
  var msg = document.getElementById("msg");
  if (p.get("error")) {
    msg.className = "err";
    msg.textContent = "Authorisation failed: " + p.get("error") + (p.get("error_description") ? " – " + p.get("error_description") : "");
  } else if (p.get("code")) {
    msg.textContent = "Authorisation successful. Copy the full address below:";
  } else {
    msg.textContent = "No authorisation code found in this address.";
  }
  document.getElementById("url").value = url;
  document.getElementById("copy").onclick = function () {
    var t = document.getElementById("url"); t.select();
    (navigator.clipboard ? navigator.clipboard.writeText(t.value) : Promise.resolve(document.execCommand("copy")))
      .then(function () { document.getElementById("copy").textContent = "Copied"; });
  };
</script>
</body>
</html>
